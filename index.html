<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KMC — Kenya Mennonite Church</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#1a3a2a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.logo{width:72px;height:72px;background:#c9a84c;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:900;color:#1a3a2a;font-size:24px;margin:0 auto 20px}
h1{font-family:'Playfair Display',serif;font-size:32px;color:#fff;text-align:center;margin-bottom:8px}
p{color:rgba(255,255,255,0.6);text-align:center;margin-bottom:40px;font-size:15px}
.btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.btn{padding:14px 32px;border-radius:10px;font-size:15px;font-weight:600;text-decoration:none;font-family:'DM Sans',sans-serif}
.btn-gold{background:#c9a84c;color:#1a3a2a}
.btn-outline{background:rgba(255,255,255,0.1);color:#fff;border:1.5px solid rgba(255,255,255,0.25)}
</style>
</head>
<body>
<div class="logo">KMC</div>
<h1>Kenya Mennonite Church</h1>
<p>Membership Information System</p>
<div class="btns">
  <a href="login.html" class="btn btn-gold">🔐 Admin Login</a>
  <a href="register-public.html" class="btn btn-outline">📝 Member Registration</a>
</div>
</body>
</html>
